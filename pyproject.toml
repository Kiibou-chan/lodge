[project]
name = "lodge"
version = "0.1.0"
description = "Knowledge tool for agent-built software: decisions and specification entries, levelled reads, a check."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML"]

[project.scripts]
lodge = "lodge.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "mypy", "ruff", "vulture", "types-PyYAML"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds and installs the wheel, which needs uv and usually the network"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "README.md", "CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID", "PLC0415"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.vulture]
paths = ["src", "tests", "vulture_allow.py"]
min_confidence = 60
